site_name: ghp
site_description: GitHub Proxy for Autonomous Coding Agents
site_url: https://goodtune.github.io/ghp/
repo_url: https://github.com/goodtune/ghp
repo_name: goodtune/ghp

theme:
  name: shadcn
  custom_dir: docs/overrides

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How It Works: how-it-works.md
  - Features:
    - Token Scoping: features/token-scoping.md
    - Token Type Border Policy: features/border-policy.md
    - Release Download Controls: features/release-controls.md
    - Codeload Redirect: features/codeload.md
    - Outbound Proxy Pool: features/egress.md
    - OAuth Broker: features/oauth-broker.md
  - Administration:
    - Installation: admin/installation.md
    - Configuration: admin/configuration.md
    - Vault Backend: admin/vault.md
    - GitHub App Setup: admin/github-app.md
    - Deployment: admin/deployment.md
    - Monitoring: admin/monitoring.md
    - Local TLS: admin/local-tls.md
  - CLI Reference:
    - Overview: cli/index.md
    - ghp serve: cli/serve.md
    - ghp migrate: cli/migrate.md
    - ghp auth: cli/auth.md
    - ghp token: cli/token.md
    - ghp apptoken: cli/apptoken.md
  - Web UI: web-ui.md
  - Development: development.md
