# GHP - GitHub Proxy for Autonomous Coding Agents
# Full reference: https://github.com/goodtune/ghp

# Optional outbound proxy pool. Omit to retain HTTP_PROXY/HTTPS_PROXY behavior.
# NO_PROXY still applies. All pool changes require a restart.
# egress:
#   strategy: weighted_round_robin  # or least_connections, ip_hash
#   proxies:
#     - name: egress-a
#       url: http://proxy-a.internal:3128
#       weight: 3                  # defaults to 1
#     - name: egress-b
#       url: http://proxy-b.internal:3128
#       weight: 1

github:
  # app_id: 0
  # client_id: ""
  # client_secret: ""
  # private_key_file: /etc/ghp/github-app.pem
  # enterprise_slug: ""
  # enterprise_exceptions:      # exempt targets from the enterprise restriction header
  #   - match: [torvalds, kubernetes/website]
  #     teams: [my-org/oss-team]              # optional membership gate
  #     identity:
  #       app_record_id: ""                   # optional managed identity (admin UI app record)

database:
  driver: sqlite
  dsn: /var/lib/ghp/ghp.db

server:
  listen: ":8080"
  # To enable systemd socket activation (for zero-downtime restarts),
  # set the following to true and enable ghp.socket:
  #   systemctl enable --now ghp.socket
  #   systemctl edit ghp.service  # add Requires=ghp.socket under [Unit]
  # systemd_socket_activation: true

# tls:
#   certificates:
#     - cert_file: /etc/ghp/tls/cert.pem
#       key_file: /etc/ghp/tls/key.pem

tokens:
  default_duration: 24h
  max_duration: 168h

logging:
  # All logs are emitted as OpenTelemetry log records (HTTP semantic
  # conventions) to the console. "level" filters operational logs; access and
  # audit records are always emitted.
  output: stdout
  level: info

# otel:                 # Additionally export log records to an OTLP collector
#   enabled: false      # logs are always written to the console regardless
#   endpoint: ""        # e.g. http://localhost:4317; http:// disables TLS
#   protocol: grpc      # "grpc" or "http"

metrics:
  # Prometheus metrics are served on a dedicated port (separate from the proxy
  # port) so they can be network-isolated from agent traffic.
  enabled: true    # set to false to disable
  listen: ":9136"  # metrics server listen address

# encryption_key: ""  # Or set GHP_ENCRYPTION_KEY env var

# admins:
#   - github-username
